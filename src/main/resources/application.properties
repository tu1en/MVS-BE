# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Server Configuration
server.port=8088
server.servlet.context-path=/
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
# Trong application.properties hoặc application.yml
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Spring Boot Configuration
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=local

# CRITICAL FIX: Change DDL auto to prevent auto-drop
# application.properties
spring.jpa.hibernate.ddl-auto=create-drop
# Alternative options:
# spring.jpa.hibernate.ddl-auto=create (only creates, doesn't drop on shutdown)
# spring.jpa.hibernate.ddl-auto=validate (production-ready)

# Enable email service
email.service.enabled=true

# Local File Storage Configuration
file.upload.dir=uploads

# SQL Server Database Configuration - Enhanced
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SchoolManagementDB;encrypt=false;trustServerCertificate=true;loginTimeout=30;socketTimeout=30
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configuration - Enhanced
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# CRITICAL: Prevent auto schema validation on startup
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Database connection validation - Enhanced
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JSON Serialization Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# Transaction Management - Enhanced
spring.transaction.default-timeout=60
spring.transaction.rollback-on-commit-failure=true

# CRITICAL: Disable all migration tools to prevent conflicts
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Application name
spring.application.name=classroom-backend

