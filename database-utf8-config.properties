# Database UTF-8 Configuration
# Add these properties to your application.properties file

# MySQL/MariaDB UTF-8 Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/SchoolManagementDB?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate UTF-8 Configuration
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# HTTP Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# Spring Boot UTF-8 Configuration
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.force-request=true
spring.http.encoding.force-response=true

# Jackson UTF-8 Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Logging Configuration for UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# JVM UTF-8 Configuration (add to JVM arguments)
# -Dfile.encoding=UTF-8
# -Dconsole.encoding=UTF-8
# -Dsun.jnu.encoding=UTF-8
